/* planet sprites cached per tier & size */
const sprites={};
function sprite(t,px){const key=t+'_'+px;if(sprites[key])return sprites[key];const T=TIERS[t],pad=T.f==='ring'?1.0:T.f==='star'||T.f==='hole'?.55:.12,S2=Math.ceil(px*2*(1+pad)),c=document.createElement('canvas');c.width=c.height=S2;const g=c.getContext('2d'),R=px,C=S2/2;
 if(T.f==='star'||T.f==='hole'){const gl=g.createRadialGradient(C,C,R*.6,C,C,R*1.55);gl.addColorStop(0,T.f==='hole'?'#b48cff88':T.c[1]+'aa');gl.addColorStop(1,'transparent');g.fillStyle=gl;g.fillRect(0,0,S2,S2);}

  g.save();g.translate(C,C);g.rotate(-.3);g.scale(1,.28);g.strokeStyle='#ffb36b';g.lineWidth=R*.18;g.globalAlpha=.85;g.beginPath();g.arc(0,0,R*1.35,0,7);g.stroke();g.restore();}
 else{const gr=g.createRadialGradient(C-R*.35,C-R*.4,R*.1,C,C,R);gr.addColorStop(0,T.c[0]);gr.addColorStop(.55,T.c[1]);gr.addColorStop(1,T.c[2]);g.fillStyle=gr;g.beginPath();g.arc(C,C,R,0,7);g.fill();

  const rnd=mulberry(t*99+7);
  if(T.f==='craters')for(let i=0;i<5;i++){const a=rnd()*7,d=rnd()*R*.7,cr=R*(.1+rnd()*.14);g.fillStyle='rgba(0,0,0,.16)';g.beginPath();g.arc(C+Math.cos(a)*d,C+Math.sin(a)*d,cr,0,7);g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(C+Math.cos(a)*d-cr*.25,C+Math.sin(a)*d-cr*.25,cr*.55,0,7);g.fill();}

  g.restore();
