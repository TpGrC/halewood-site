 const key=t=>t.map(x=>x.join(',')).sort().join('|');

  for(let i=0;i<t.length;i++){const a=t[i];if(!a.length)continue;const top=a[a.length-1];if(a.length===CAP&&a.every(v=>v===top))continue;
   let run=0;for(let k2=a.length-1;k2>=0&&a[k2]===top;k2--)run++;
   for(let j=0;j<t.length;j++){if(i===j)continue;const b=t[j];if(b.length>=CAP)continue;if(b.length&&b[b.length-1]!==top)continue;if(!b.length&&run===a.length)continue;
    const n=Math.min(run,CAP-b.length);const nt=t.map(x=>x.slice());for(let q=0;q<n;q++)nt[j].push(nt[i].pop());if(dfs(nt))return true}}
  return false}
 return dfs(tubes)}

 for(let tries=0;tries<40;tries++){const u=[];for(let c=0;c<colors;c++)for(let k=0;k<CAP;k++)u.push(c);
  for(let i=u.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[u[i],u[j]]=[u[j],u[i]]}
  const t=[];for(let c=0;c<colors;c++)t.push(u.slice(c*CAP,c*CAP+CAP));for(let e=0;e<empty;e++)t.push([]);

  if(solvable(t.map(x=>x.slice())))return t}
